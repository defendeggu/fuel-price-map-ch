name: Scrape Fuel Prices

on:
  schedule:
    # Täglich 01:00 CET (00:00 UTC); im Sommer 02:00 CEST
    - cron: "0 0 * * *"
  workflow_dispatch:  # Manuell auslösbar

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Der Scraper nutzt nur die Standardbibliothek (kein pip install nötig).
      - name: Unit-Tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # Schlägt fehl (Workflow rot → Mail), wenn der Abruf scheitert oder die Daten
      # unplausibel sind. Dann wird nichts committet.
      - name: Scrape Preise
        run: python scripts/scrape.py

      - name: Commit & Push (falls geändert)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/canton-prices.json data/price-history.json
          git diff --cached --quiet || \
            git commit -m "chore: Treibstoffpreise $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase
          git push
